services:
  postgres:
    image: postgres:15-alpine
    container_name: netsec-postgres
    environment:
      POSTGRES_DB: netsec
      POSTGRES_USER: netsec_user
      POSTGRES_PASSWORD: netsec_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsec_user -d netsec"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: dockerfile
    container_name: netsec-dashboard
    environment:
      DATABASE_URL: postgresql://netsec_user:netsec_password@postgres:5432/netsec
      GROQ_API_KEY: ${GROQ_API_KEY}
      NETCONFIG_SECRET_KEY: ${NETCONFIG_SECRET_KEY:-change-me-in-production}
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./outputs:/app/outputs

volumes:
  postgres_data: